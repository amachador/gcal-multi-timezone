<!doctype html>
<html><head><meta charset="utf-8"><title>mock gcal</title>
<link rel="stylesheet" href="../content.css">
<style>
 body{margin:0;font:12px Roboto,Arial,sans-serif;background:#f8fafd;color:#3c4043;display:flex;height:100vh}
 #side{width:256px;flex:none;padding:16px;transition:width .3s ease;overflow:hidden}
 #side.c{width:56px}
 .allday{height:0;overflow:hidden;transition:height .25s ease;background:#f1f3f4}
 .allday.o{height:80px}
 [role=main]{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:16px;margin:8px 8px 8px 0;overflow:hidden}
 .hdr{height:70px;display:flex;border-bottom:1px solid #dadce0}
 .hdr .gmt{width:56px;align-self:flex-end;font-size:10px;color:#70757a;padding-bottom:4px}
 .hdr .d{flex:1;text-align:center;padding-top:12px}
 .scroll{flex:1;overflow-y:auto;display:flex}
 .gutter{width:56px;flex:none;position:relative;height:1152px;transition:margin-top .25s}
 .gutter span{position:absolute;right:8px;font-size:10px;color:#70757a;transform:translateY(-50%)}
 .grid{flex:1;position:relative;height:1152px;background:repeating-linear-gradient(#fff 0 47px,#dadce0 47px 48px)}
 .now{position:absolute;left:0;right:0;height:2px;background:#ea4335}
</style></head><body>
<div id="side">sidebar<div id="cap" style="position:fixed;left:300px;top:30px;font-size:10px;color:#70757a">MVD</div></div>
<div role="main">
  <div class="hdr"><div class="gmt">GMT-03</div><div class="d">Thu 26</div><div class="d">Fri 27</div></div>
  <div class="allday" id="ad">all-day</div>
  <div class="scroll" id="sc"><div class="gutter" id="g"></div><div class="grid"><div class="now" id="now"></div></div></div>
</div>
<script>
 const g=document.getElementById('g');
 const h24 = location.search.includes('h24');
 for(let h=1;h<24;h++){const s=document.createElement('span');s.style.top=(h*48)+'px';
   s.textContent=h24?String(h).padStart(2,'0')+':00':((h%12)||12)+' '+(h<12?'AM':'PM');g.appendChild(s);}
 const d=new Date(); document.getElementById('now').style.top=((d.getHours()+d.getMinutes()/60)*48)+'px';
 document.getElementById('sc').scrollTop=300;
 // chrome shim
 window.chrome={storage:{sync:{get:(d,cb)=>cb(Object.assign({},d,JSON.parse(localStorage.gtz||'{}'))),set:()=>{}},onChanged:{addListener(){}}}};
</script>
<script src="../content.js"></script>
</body></html>
