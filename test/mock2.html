<!doctype html>
<html><head><meta charset="utf-8"><title>mock gcal 2</title>
<link rel="stylesheet" href="/content.css">
<style>
 body{margin:0;font:12px Roboto,Arial,sans-serif;background:#131314;color:#e3e3e3;display:flex;height:100vh}
 #side{width:256px;flex:none;padding:16px;transition:width .3s ease;overflow:hidden}
 #side.c{width:56px}
 [role=main]{flex:1;display:flex;flex-direction:column;background:#1a1a1a;border-radius:16px;margin:56px 8px 8px 0;overflow:hidden}
 .hdr{height:60px;display:flex;border-bottom:1px solid #444;position:relative}
 .hdr .cap{position:absolute;left:10px;top:12px;font-size:10px}
 .allday{height:0;overflow:hidden;transition:height .25s ease;background:#2a2a2a}
 .allday.o{height:110px}
 .body{flex:1;display:flex;min-height:0}
 .gw{width:56px;flex:none;overflow:hidden;position:relative}
 .g{position:absolute;left:0;right:0;top:0;height:1152px}
 .g span{position:absolute;right:8px;font-size:10px;color:#9aa0a6;transform:translateY(-50%)}
 .scroll{flex:1;overflow-y:scroll;position:relative}
 .grid{background-image:repeating-linear-gradient(#1a1a1a 0 47px,#444 47px 48px)}
 .grid{height:1152px;background:repeating-linear-gradient(#1a1a1a 0 47px,#444 47px 48px)}
 .now{position:absolute;left:0;right:0;height:2px;background:#ea4335}
</style></head><body>
<div id="side">sidebar</div>
<div role="main">
  <div class="hdr"><span class="cap">MVD</span><span class="cap ghost" style="top:36px;opacity:0">MVD</span><div class="days" style="display:flex;margin-left:56px;flex:1;"><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">26</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">27</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">28</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">29</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">30</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">31</span><span style="flex:1;text-align:center;padding-top:22px;font-size:14px">1</span></div></div>
  <div class="allday" id="ad">all-day</div>
  <div class="body"><div class="gw"><div class="g" id="g"></div></div>
   <div class="scroll" id="sc"><div class="grid"></div><div class="now" id="now"></div></div></div>
</div>
<script>
 history.replaceState(null,"","/calendar/u/0/r/week/2026/10/28");
 const g=document.getElementById('g'), sc=document.getElementById('sc');
 for(let h=1;h<24;h++){const s=document.createElement('span');s.style.top=(h*48)+'px';s.textContent=String(h).padStart(2,'0')+':00';g.appendChild(s);}
 const d=new Date(); document.getElementById('now').style.top=((d.getHours()+d.getMinutes()/60)*48)+'px';
 sc.addEventListener('scroll',()=>{g.style.transform='translateY('+(-sc.scrollTop)+'px)'});
 sc.scrollTop=300;
 localStorage.removeItem('gtz'); const lsn=[];
 window.chrome={storage:{sync:{get:(d,cb)=>cb(Object.assign({},d,JSON.parse(localStorage.gtz||'{}'))),set:()=>{}},onChanged:{addListener:f=>lsn.push(f)}},runtime:{onMessage:{addListener:f=>{window.__msg=f}}}};
 window.__gtzSet=o=>{localStorage.gtz=JSON.stringify(Object.assign(JSON.parse(localStorage.gtz||'{}'),o));lsn.forEach(f=>f())};
</script>
<script src="/content.js"></script>
</body></html>
